[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-engine"
version = "0.7.0"
description = "AI-independent platform that builds and maintains structured knowledge repositories as Markdown."
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies are added only when a milestone actually needs them.
# M1 adds feedparser, because real-world RSS and Atom are inconsistent in ways a
# hand-rolled parser discovers slowly. HTTP uses urllib and HTML uses
# html.parser, both standard library -- `requests` and BeautifulSoup were not
# needed and so were not added.
dependencies = [
    "PyYAML>=6.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ke = "ke.__main__:main"

# The engine is packaged from `engine/` rather than the repository root so that
# it can later be extracted into its own repository without moving any files.
# Domain packs are pure data and are deliberately NOT part of the package.
[tool.setuptools]
package-dir = { "" = "engine" }

[tool.setuptools.packages.find]
where = ["engine"]
include = ["ke*"]

# The prompt templates are data the engine cannot work without: `ke generate`
# reads them at runtime, and a build that omits them produces a package whose
# every artifact type fails with "no prompt template".
#
# What actually makes them ship is that they live *inside* `ke/`. Current
# setuptools includes them without this declaration, but that is a default, and
# a default is a weaker guarantee than a statement. Declared explicitly so the
# requirement survives a build-backend change; `test_packaging.py` installs the
# package and verifies it either way.
[tool.setuptools.package-data]
ke = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
