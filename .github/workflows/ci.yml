name: CI

# Runs on every push and pull request. This is the guardrail that keeps the
# CLAUDE.md rules enforceable rather than aspirational.
#
# Cost note: this repository is private on the GitHub Free plan, which allows
# 2,000 Actions minutes per month. This job takes well under a minute, and the
# weekly harvest (M6) adds roughly 22 minutes a month, so the budget is not a
# constraint. `concurrency` cancels superseded runs on the same branch so a
# quick succession of pushes does not burn minutes on results nobody will read.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the engine
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest engine/tests -q

      - name: Validate domain packs
        # Validates every pack in the repository. Warnings are reported and
        # pass; errors fail the build. Once the first pack is populated and
        # clean, this becomes `--strict`.
        run: python -m ke validate

      - name: Assert the scheduled pipeline never invokes an AI model
        # The engine is AI-vendor-independent because generation is on demand
        # only. If `ke generate` ever appears in a scheduled workflow, that
        # guarantee is broken and the cost model goes with it. This check
        # exists from M0 so the rule cannot be quietly broken in M6.
        run: |
          set -euo pipefail
          shopt -s nullglob
          offenders=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            if grep -q "^on:" "$workflow" && grep -qE "^\s*schedule:" "$workflow"; then
              if grep -qE "ke +generate|python -m ke +generate" "$workflow"; then
                offenders+=("$workflow")
              fi
            fi
          done
          if [ ${#offenders[@]} -gt 0 ]; then
            echo "::error::scheduled workflow invokes 'ke generate': ${offenders[*]}"
            echo "Generation is on-demand only. See docs/SCHEMA.md and CLAUDE.md."
            exit 1
          fi
          echo "ok: no scheduled workflow invokes 'ke generate'"
