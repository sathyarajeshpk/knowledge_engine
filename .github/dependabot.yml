# Dependency and Action update alerts.
#
# M6's security review carried two findings this addresses:
#
#   S-4 — no CVE scanning. Nothing was watching for advisories against the two
#         runtime dependencies, so a known-vulnerable release could sit in the
#         weekly harvest indefinitely.
#   S-2 — Actions pinned by tag rather than commit SHA. `@v4` trusts the tag not
#         to be moved, which is the standard supply-chain path into a workflow
#         holding a write token.
#
# Dependabot is the right tool for both: it opens a pull request, CI runs, and a
# human merges. Nothing here updates anything automatically — an unattended
# weekly job that could also update its own dependencies would be a strictly
# worse version of the problem this file exists to solve.

version: 2

updates:
  # The Python runtime dependencies. `requirements.lock` is generated by
  # `tools/lock_dependencies.py`; when Dependabot proposes a version bump, that
  # script is what regenerates the hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # GitHub Actions. Left on tag pins deliberately, with Dependabot watching:
  # SHA pinning is stricter, and it is only an improvement if the SHAs are
  # correct. See docs/reviews/M7_SECURITY_REVIEW.md for why they are not pinned
  # here yet.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "actions"
    labels:
      - "dependencies"
