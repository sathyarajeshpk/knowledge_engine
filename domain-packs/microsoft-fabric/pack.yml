# Microsoft Fabric Domain Pack
#
# A Domain Pack is pure data. Adding a new pack must never require changing the
# engine -- that property is proven in M8 by adding the Power BI pack and
# confirming `git diff engine/` is empty.
#
# Sections are annotated with the milestone that activates them. `ke validate`
# in M0 requires only `name`, `id_prefix` and `schema_version`; everything else
# is checked when present and becomes required as its milestone lands.

name: microsoft-fabric
display_name: Microsoft Fabric
description: >-
  Knowledge about Microsoft Fabric: data engineering, data warehousing,
  real-time intelligence, data science, Power BI, and the Fabric platform
  itself.

# Permanent. Changing this would orphan every Feature ID already minted.
#
# This pack covers the whole Fabric platform *including Power BI*, which is a
# Fabric workload rather than a separate product (ADR-0016). Power BI knowledge
# is addressed by `category: power-bi` and tags, not by a separate pack -- packs
# are source and identity boundaries, indexes handle topics.
#
# The `PBI` prefix stays reserved and unused in case Power BI later warrants its
# own pack. Such a split would apply to new content only; existing MSF objects
# keep their permanent identifiers.
id_prefix: MSF

schema_version: 1

# --- Limits (M0) -----------------------------------------------------------
limits:
  # Copyright guard. We store a short original summary and a link, never the
  # full text of a third-party article. Enforced by `ke validate`.
  max_summary_words: 120

# --- Categories (M3) -------------------------------------------------------
# The `category` field must be one of these. Kept deliberately coarse; finer
# distinctions belong in `tags`.
categories:
  - data-engineering
  - data-warehouse
  - data-science
  - real-time-intelligence
  - data-factory
  - power-bi
  - governance-security
  - administration
  - platform

# --- Sources (M1) ----------------------------------------------------------
# Every URL below was verified on a GitHub Actions runner before being pinned.
# See docs/reviews/M1_SOURCE_VALIDATION.md for the evidence, including the
# candidates that were rejected and why.
#
# Source definitions are IMMUTABLE. Never delete one -- provenance on every
# object it produced points at it. Retire a source by moving `status` to
# deprecated, disabled or replaced (ADR-0024).
#
# `adapter.version` is the parser version stamped onto every item this source
# produces. Increment it when the extraction strategy changes, so historical
# objects stay attributable to the parser that made them.
sources:
  # The primary source. Validation: 131,730 chars of visible text, 23 tables,
  # 177 dates, ms.date current. Contains a "Power BI" section, which is why one
  # pack covers both products (ADR-0016).
  - name: fabric-whats-new
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: html
      version: 1
    notes: >-
      Canonical curated list of Fabric updates. Highest-signal source available;
      no purpose-built update feed is reachable from a runner.
    fallback:
      - name: fabric-docs-commits
        url: https://github.com/MicrosoftDocs/fabric-docs/commits/main.atom
        authority: official-microsoft
        role: secondary
        adapter:
          name: github-commits
          version: 1
        notes: >-
          Reliable and current, but merge-commit noise. A weak substitute --
          hence degraded rather than healthy when it is used.
      - name: fabric-whats-new-manual
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new
        authority: official-microsoft
        role: manual-review
        adapter:
          name: manual
          version: 1
        notes: Terminal link. Raises a review item rather than losing knowledge.

  # Power BI Desktop monthly updates. Validation: server-rendered, 11 headings,
  # 6 tables, ms.date current.
  - name: powerbi-whats-new
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/desktop-latest-update
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: html
      version: 1
    fallback:
      - name: powerbi-docs-commits
        url: https://github.com/MicrosoftDocs/powerbi-docs/commits/main.atom
        authority: official-microsoft
        role: secondary
        adapter:
          name: github-commits
          version: 1
      - name: powerbi-whats-new-manual
        url: https://learn.microsoft.com/en-us/power-bi/fundamentals/desktop-latest-update
        authority: official-microsoft
        role: manual-review
        adapter:
          name: manual
          version: 1

  # Corporate blog. Low value and stale (newest entry a month old at validation)
  # but it is a real blog feed. Ships 29,000-character full articles, so
  # truncation at ingest is mandatory (ADR-0003).
  - name: fabric-blog
    url: https://www.microsoft.com/en-us/microsoft-fabric/blog/feed/
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: rss
      version: 1

# Rejected candidates, recorded so they are not re-proposed:
#   learn.microsoft.com/api/search/rss (fabric, power bi, whats-new queries)
#     -- returns documentation landing pages ranked by search relevance, not
#        announcements. Mechanically perfect, semantically wrong.
#   learn.microsoft.com/en-us/fabric/known-issues/
#     -- 2,226 visible chars against a 2,000 shell threshold, zero tables,
#        ms.date a year stale. Profile closer to a JavaScript app than a page.
#   blog.fabric.microsoft.com/* and powerbi.microsoft.com/* feeds
#     -- 403 from a runner, including with a browser User-Agent.
#   roadmap.fabric.microsoft.com
#     -- JavaScript app; 196 KB yields 2,185 chars and zero dates.

# --- Deduplication (M2) ----------------------------------------------------
dedupe:
  # Titles above this Jaccard similarity are flagged as possible duplicates.
  # They are stored with `needs_review: true` and surfaced in the digest --
  # never dropped, because a silent drop would violate "never delete
  # existing knowledge" in spirit.
  near_duplicate_jaccard: 0.85

# --- Classification rules (M3) ---------------------------------------------
# Rules live here as data, not in engine code, so the vocabulary can be tuned
# without a code change. Anything that matches no rule becomes tier 3 with
# `needs_review: true` -- never a silent guess.
classification: {}

# --- Notifications (M6) ----------------------------------------------------
# The GitHub Issue is the durable audit trail; SMTP is the inbox copy. Both go
# through the same pluggable Notifier interface, so Telegram, Slack, Discord or
# Teams can be added later without touching the core engine.
notifiers: []
