# Microsoft Fabric Domain Pack
#
# A Domain Pack is pure data. Adding a new pack must never require changing the
# engine -- that property is proven in M8 by adding the Power BI pack and
# confirming `git diff engine/` is empty.
#
# Sections are annotated with the milestone that activates them. `ke validate`
# in M0 requires only `name`, `id_prefix` and `schema_version`; everything else
# is checked when present and becomes required as its milestone lands.

name: microsoft-fabric
display_name: Microsoft Fabric
description: >-
  Knowledge about Microsoft Fabric: data engineering, data warehousing,
  real-time intelligence, data science, Power BI, and the Fabric platform
  itself.

# Permanent. Changing this would orphan every Feature ID already minted.
#
# This pack covers the whole Fabric platform *including Power BI*, which is a
# Fabric workload rather than a separate product (ADR-0016). Power BI knowledge
# is addressed by `category: power-bi` and tags, not by a separate pack -- packs
# are source and identity boundaries, indexes handle topics.
#
# The `PBI` prefix stays reserved and unused in case Power BI later warrants its
# own pack. Such a split would apply to new content only; existing MSF objects
# keep their permanent identifiers.
id_prefix: MSF

schema_version: 1

# --- Limits (M0) -----------------------------------------------------------
limits:
  # Copyright guard. We store a short original summary and a link, never the
  # full text of a third-party article. Enforced by `ke validate`.
  max_summary_words: 120

# --- Categories (M3) -------------------------------------------------------
# The `category` field must be one of these. Kept deliberately coarse; finer
# distinctions belong in `tags`.
categories:
  - data-engineering
  - data-warehouse
  - data-science
  - real-time-intelligence
  - data-factory
  - power-bi
  - governance-security
  - administration
  - platform

# --- Sources (M1) ----------------------------------------------------------
# Every URL below was verified on a GitHub Actions runner before being pinned.
# See docs/reviews/M1_SOURCE_VALIDATION.md for the evidence, including the
# candidates that were rejected and why.
#
# Source definitions are IMMUTABLE. Never delete one -- provenance on every
# object it produced points at it. Retire a source by moving `status` to
# deprecated, disabled or replaced (ADR-0024).
#
# `adapter.version` is the parser version stamped onto every item this source
# produces. Increment it when the extraction strategy changes, so historical
# objects stay attributable to the parser that made them.
sources:
  # The primary source. Validation: 131,730 chars of visible text, 23 tables,
  # 177 dates, ms.date current. Contains a "Power BI" section, which is why one
  # pack covers both products (ADR-0016).
  - name: fabric-whats-new
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: html
      version: 1
    notes: >-
      Canonical curated list of Fabric updates. Highest-signal source available;
      no purpose-built update feed is reachable from a runner.
    fallback:
      # The Markdown source behind the same page: same authoritative content,
      # different host, different failure mode. Replaces the docs-commit feed,
      # which carried merge-commit noise rather than knowledge.
      - name: fabric-whats-new-markdown
        url: https://raw.githubusercontent.com/MicrosoftDocs/fabric-docs/main/docs/fundamentals/whats-new.md
        authority: official-microsoft
        role: secondary
        adapter:
          name: markdown
          version: 1
        options:
          # Needed to rebuild canonical URLs from relative .md links. Identity
          # rests on those URLs, so this is configuration rather than a guess.
          doc_path: docs/fundamentals/whats-new.md
          docs_prefix: docs/
          rendered_base_url: https://learn.microsoft.com/en-us/fabric
        notes: >-
          Verified 200, 189,900 bytes, 361 table rows, authoritative ms.date
          front matter. Links are relative, so canonical URLs are reconstructed
          -- which is why this is secondary rather than primary.
      - name: fabric-whats-new-manual
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new
        authority: official-microsoft
        role: manual-review
        adapter:
          name: manual
          version: 1
        notes: Terminal link. Raises a review item rather than losing knowledge.

  # Power BI Desktop monthly updates. Validation: server-rendered, 11 headings,
  # 6 tables, ms.date current.
  # Note: /desktop-latest-update redirects here. Pinned to the final URL so the
  # canonical URL used for identity does not depend on a redirect being followed.
  - name: powerbi-whats-new
    url: https://learn.microsoft.com/en-us/power-bi/fundamentals/whats-new
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: html
      version: 1
    fallback:
      # Re-enabled. It was briefly disabled because failing over would have
      # minted ~5 duplicate permanent Feature IDs out of 19; the Identity
      # Confidence gate (ADR-0028) closes that by construction rather than by
      # judgement.
      #
      # Measured: both representations yield the SAME 14 high-confidence items,
      # and those are exactly the 14 whose identities agree across
      # representations. Failing over therefore mints the same objects, not
      # duplicates. The 5 that diverge are precisely the weak-anchored ones the
      # gate holds back for review.
      #
      # Fallback execution is independent of minting: the chain decides where
      # knowledge comes from, the gate decides what is safe to mint from it.
      - name: powerbi-whats-new-markdown
        url: https://raw.githubusercontent.com/MicrosoftDocs/powerbi-docs/main/powerbi-docs/fundamentals/whats-new.md
        authority: official-microsoft
        role: secondary
        adapter:
          name: markdown
          version: 1
        options:
          doc_path: powerbi-docs/fundamentals/whats-new.md
          docs_prefix: powerbi-docs/
          rendered_base_url: https://learn.microsoft.com/en-us/power-bi
      - name: powerbi-whats-new-manual
        url: https://learn.microsoft.com/en-us/power-bi/fundamentals/whats-new
        authority: official-microsoft
        role: manual-review
        adapter:
          name: manual
          version: 1

  # Corporate blog. Low value and stale (newest entry a month old at validation)
  # but it is a real blog feed. Ships 29,000-character full articles, so
  # truncation at ingest is mandatory (ADR-0003).
  - name: fabric-blog
    url: https://www.microsoft.com/en-us/microsoft-fabric/blog/feed/
    authority: official-microsoft
    status: active
    role: primary
    adapter:
      name: rss
      version: 1

# Rejected candidates, recorded so they are not re-proposed:
#   learn.microsoft.com/api/search/rss (fabric, power bi, whats-new queries)
#     -- returns documentation landing pages ranked by search relevance, not
#        announcements. Mechanically perfect, semantically wrong.
#   learn.microsoft.com/en-us/fabric/known-issues/
#     -- 2,226 visible chars against a 2,000 shell threshold, zero tables,
#        ms.date a year stale. Profile closer to a JavaScript app than a page.
#   blog.fabric.microsoft.com/* and powerbi.microsoft.com/* feeds
#     -- 403 from a runner, including with a browser User-Agent.
#   roadmap.fabric.microsoft.com
#     -- JavaScript app; 196 KB yields 2,185 chars and zero dates.

# --- Deduplication (M2) ----------------------------------------------------
dedupe:
  # Titles above this Jaccard similarity are flagged as possible duplicates.
  # They are stored with `needs_review: true` and surfaced in the digest --
  # never dropped, because a silent drop would violate "never delete
  # existing knowledge" in spirit.
  near_duplicate_jaccard: 0.85

# --- Classification rules (M3) ---------------------------------------------
# Rules live here as data, not in engine code, so the vocabulary can be tuned
# without a code change. Anything that matches no rule becomes tier 3 with
# `needs_review: true` -- never a silent guess.
classification:
  # Operational impact. 1 = act now, 2 = learn soon, 3 = awareness.
  tier:
    - name: breaking-or-deprecated
      any: [deprecat, breaking change, end of support, retirement, will be removed]
      value: 1
    - name: security-and-governance
      any: [security, private link, encryption, customer managed key, compliance,
            purview, sensitivity label, access control]
      value: 1
    - name: generally-available
      any: [generally available, "(ga)", general availability, now available]
      none: [preview]
      value: 1
    - name: preview-features
      any: [preview, public preview, coming soon]
      value: 2
    - name: enhancements
      any: [improvement, enhanced, faster, performance, optimiz, optimis]
      value: 2

  learning_priority:
    - name: core-platform
      any: [onelake, direct lake, semantic model, lakehouse, warehouse, capacity]
      value: high
    - name: workload-features
      any: [notebook, pipeline, dataflow, eventstream, eventhouse, spark, sql]
      value: medium
    - name: peripheral
      any: [blog, recap, community, event, announcement, ama]
      value: low

  # Must be one of the `categories` list above.
  category:
    - name: real-time
      any: [eventstream, eventhouse, kql, real-time, realtime, activator]
      value: real-time-intelligence
    - name: data-factory
      any: [data factory, pipeline, dataflow, copy job, mirroring, gateway]
      value: data-factory
    - name: warehouse
      any: [warehouse, sql analytics endpoint, t-sql, sql database]
      value: data-warehouse
    - name: data-science
      any: [notebook, spark, machine learning, ml model, data science, ai function]
      value: data-science
    - name: power-bi
      any: [power bi, report, dashboard, visual, dax, semantic model]
      value: power-bi
    - name: governance
      any: [security, governance, purview, sensitivity, private link, encryption]
      value: governance-security
    - name: admin
      any: [admin, tenant, capacity, monitoring, workspace setting, quota]
      value: administration
    - name: engineering
      any: [lakehouse, onelake, delta, shortcut, data engineering]
      value: data-engineering
    - name: platform
      any: [fabric, platform, git integration, deployment pipeline, api]
      value: platform

  difficulty:
    - name: advanced-topics
      any: [api, sdk, private link, encryption, custom, advanced, architecture]
      value: advanced
    - name: beginner-topics
      any: [getting started, introduction, overview, tutorial, announcement, recap]
      value: beginner
    - name: default-intermediate
      any: [preview, generally available, support, new, improvement]
      value: intermediate

  workload:
    - name: heavy
      any: [migration, architecture, private link, encryption, capacity planning]
      value: heavy
    - name: light
      any: [recap, announcement, blog, community, event, visual]
      value: light
    - name: moderate
      any: [preview, generally available, support, feature, new]
      value: moderate

  # Every matching tag rule contributes; the result is sorted.
  tags:
    - {any: [direct lake], value: direct-lake}
    - {any: [onelake], value: onelake}
    - {any: [lakehouse], value: lakehouse}
    - {any: [warehouse], value: warehouse}
    - {any: [semantic model], value: semantic-model}
    - {any: [notebook], value: notebook}
    - {any: [spark], value: spark}
    - {any: [pipeline], value: pipeline}
    - {any: [dataflow], value: dataflow}
    - {any: [eventstream, eventhouse], value: real-time}
    - {any: [power bi], value: power-bi}
    - {any: [copilot, ai function, data agent], value: ai}
    - {any: [security, private link, encryption], value: security}
    - {any: [api, rest api, sdk], value: api}
    - {any: [preview], value: preview}
    - {any: [generally available, "(ga)"], value: ga}
    - {any: [deprecat, retirement], value: deprecation}

# --- Notifications (M6) ----------------------------------------------------
# The GitHub Issue is the durable audit trail; SMTP is the inbox copy. Both go
# through the same pluggable Notifier interface, so Telegram, Slack, Discord or
# Teams can be added later without touching the core engine.
notifiers: []
