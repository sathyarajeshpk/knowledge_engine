  title_snapshot: Mirroring in Fabric
  summary_snapshot: 'Mirroring for Google BigQuery (Generally Available) Mirroring in Fabric
    offers a simple, low-latency way to continuously replicate your Google BigQuery data into
    OneLake with no ETL pipelines, no data movement, and no proprietary formats. Once in Fabric,
    mirrored BigQuery data is queryable in near real time across Power BI Direct Lake, the
    SQL analytics endpoint, Data Engineering, Data Science, Real-Time Intelligence, and Copilot.
    For more information, see Mirrored databases from Google BigQuery and Tutorial: Set up
    mirroring for Google BigQuery.'
