  title_snapshot: Stream Mirrored Database change feeds into Eventstreams (Preview)
  summary_snapshot: Mirrored Database change feed connector for Eventstreams (Preview) streams
    Delta Change Data Feed (CDF) row-level inserts, updates, and deletes from a mirrored database
    directly into a Fabric Eventstream for low-latency, event-driven processing, with full
    source schema and change metadata fidelity and support for Azure SQL, Cosmos DB, Oracle,
    PostgreSQL, Snowflake, and Open Mirroring partners. For more information, see Extended
    capabilities in mirroring for Fabric.
