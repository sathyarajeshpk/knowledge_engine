  title_snapshot: MCP remote servers for Activator and Eventhouse in Real-Time Intelligence
    (preview)
  summary_snapshot: Fabric Real-Time Intelligence provides hosted Model Context Protocol (MCP)
    remote servers for Activator and Eventhouse, enabling AI assistants and agents to interact
    with RTI components through natural language. By using the Activator MCP server, AI assistants
    can create monitoring rules, manage alerts, and trigger actions in Fabric Activator. The
    Eventhouse remote MCP server allows AI agents to query, reason over, and act on real-time
    data stored in an RTI eventhouse by configuring a URL that points to the Eventhouse. For
    more information, see Get started with the remote MCP server for eventhouses (preview)
    and Get started with the remote MCP server for Activator (preview). This feature is currently
    in preview.
