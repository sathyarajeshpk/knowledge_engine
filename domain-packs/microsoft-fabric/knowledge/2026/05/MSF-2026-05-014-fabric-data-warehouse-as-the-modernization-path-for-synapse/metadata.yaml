  summary_snapshot: Modernizing Synapse Dedicated SQL Pool to Fabric Data Warehouse outlines
    how Fabric Data Warehouse addresses common Synapse pain points (pause/resume scaling,
    hard concurrency limits, manual hash/replicated distribution, architectural sprawl) with
    non-disruptive online scaling, autonomous workload management, intelligent data distribution,
    OneLake-based open Delta storage, true data virtualization, near real-time mirroring,
    and the AI-assisted Migration Assistant. For more information, see What is Fabric Data
    Warehouse? and Scale your Fabric capacity.
