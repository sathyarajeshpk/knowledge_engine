  summary_snapshot: OneLake security and OneLake data access roles are generally available,
    providing fine-grained access control for OneLake data with role permissions and folder-,
    row-, and column-level security. New capabilities include a wizard-based role creation
    flow with RLS and CLS at creation time, inline RLS validation, and cross-region shortcut
    support. OneLake security is being enabled by default on all supported items by the end
    of May 2026. For more information, see Get started with OneLake security and OneLake data
    access roles.
