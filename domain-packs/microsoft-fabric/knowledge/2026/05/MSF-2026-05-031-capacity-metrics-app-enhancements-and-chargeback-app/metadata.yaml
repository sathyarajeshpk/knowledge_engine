  summary_snapshot: Capacity health page, timepoint summary, timepoint detail, and the Chargeback
    app are generally available. The health page surfaces utilization and throttling signals
    across all capacities per region, timepoint summary, and detail break down compute usage
    by workspace, item, operation, and user, and the Chargeback app supports cost allocation
    by SKU and workload type. For more information, see Understand the metrics app Health
    page and Microsoft Fabric Chargeback app.
