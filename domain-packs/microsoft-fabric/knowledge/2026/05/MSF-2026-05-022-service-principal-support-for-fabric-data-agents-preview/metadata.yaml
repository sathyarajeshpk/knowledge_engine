  title_snapshot: Service principal support for Fabric data agents (Preview)
  summary_snapshot: Fabric data agents now support service principal (SPN) authentication,
    so custom apps and Microsoft Foundry agents call the data agent API with an application
    identity instead of a delegated user token. The data agent inherits workspace permissions;
    KQL database support is coming soon.
