  summary_snapshot: There’s nothing quite like a room full of people who love data as much
    as you do. We can’t wait to reconnect with this community in Barcelona. The European Microsoft
    Fabric + SQL Community Conference (FabCon and SQLCon Europe) returns September 28-October
    1, 2026, at the Centre de Convencions Internacional de Barcelona. After a year of incredible
    innovation across Microsoft Fabric and SQL, this conference is shaping up to be something
    special. We have a lot to share—and even more to learn from each other. Following our
    record-breaking gathering of more than 4,000 data professionals in Vienna last year, FabCon
    Europe is back and bigger—with 130+ expert-led sessions, 100+ speakers, and 10+ hands-on
