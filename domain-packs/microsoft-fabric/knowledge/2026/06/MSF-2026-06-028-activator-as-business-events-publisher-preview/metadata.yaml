  title_snapshot: Activator as business events publisher (Preview)
  summary_snapshot: Activator provides a no-code way to publish business events in Microsoft
    Fabric. When Activator detects that a condition is met in your data, it can emit a structured
    business event into Real-Time hub, making that signal discoverable, routable, and consumable
    by your entire organization. For more information, see What is Fabric Activator? and Business
    events overview (Preview).
