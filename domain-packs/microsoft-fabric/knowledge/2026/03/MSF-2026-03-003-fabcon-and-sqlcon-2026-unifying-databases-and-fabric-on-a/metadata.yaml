  summary_snapshot: Welcome to the third annual FabCon and our first ever SQLCon here in Atlanta,
    Georgia. With nearly 300 workshops and sessions, this joint event will highlight how they
    are bringing the power of Microsoft SQL and Microsoft Fabric together to create a single,
    unified platform. But FabCon 2026 and SQLCon 2026 are about more than product innovation.
    It’s about providing space for our 8,000 attendees to come together and share real experiences,
